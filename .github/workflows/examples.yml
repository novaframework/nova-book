name: Companion app

on:
  pull_request:
    branches: [main]
    paths:
      - "examples/blog/**"
      - ".github/workflows/examples.yml"

permissions:
  contents: read

jobs:
  blog:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: examples/blog

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "29"
          rebar3-version: "3.27"

      - name: Schemas match migrations
        run: rebar3 kura check

      - name: Compile
        run: rebar3 compile

      - name: Nothing generated by the build
        run: |
          git status --porcelain -- .
          test -z "$(git status --porcelain -- .)"

      - name: Formatting
        run: rebar3 fmt --check

      - name: Cross reference
        run: rebar3 xref

      - name: Migration safety
        run: rebar3 kura lint_migrations

      - name: Dialyzer PLT cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: examples/blog/_build/default/*_plt
          key: plt-${{ runner.os }}-otp29-${{ hashFiles('examples/blog/rebar.lock') }}

      - name: Dialyzer
        run: rebar3 dialyzer

      - name: EUnit
        run: rebar3 eunit

      - name: Common Test
        run: |
          epmd -daemon
          rebar3 ct

      - name: Keep Common Test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ct-logs
          path: examples/blog/_build/test/logs
          retention-days: 7
