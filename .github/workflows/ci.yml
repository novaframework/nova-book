name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mdBook
        run: |
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.44/mdbook-v0.4.44-x86_64-unknown-linux-gnu.tar.gz | tar xz
          echo "$PWD" >> $GITHUB_PATH

      - name: Install mdbook-admonish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.18.0 -R tommilligan/mdbook-admonish -p 'mdbook-admonish-v1.18.0-x86_64-unknown-linux-gnu.tar.gz' -O - | tar xz
          echo "$PWD" >> $GITHUB_PATH

      - name: Build book
        run: mdbook build
