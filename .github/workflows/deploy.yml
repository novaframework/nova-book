name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mdBook
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.4.44 -R rust-lang/mdBook -p 'mdbook-v0.4.44-x86_64-unknown-linux-gnu.tar.gz' -O - | tar xz
          echo "$PWD" >> $GITHUB_PATH

      - name: Install mdbook-admonish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.18.0 -R tommilligan/mdbook-admonish -p 'mdbook-admonish-v1.18.0-x86_64-unknown-linux-gnu.tar.gz' -O - | tar xz
          echo "$PWD" >> $GITHUB_PATH

      - name: Build book
        run: mdbook build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./book/html

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
